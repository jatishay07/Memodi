<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memodi — Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 700px; height: 380px;
    background: var(--gradient-page);
    padding: 26px 36px;
    box-sizing: border-box;
    font-family: var(--font-body);
    color: var(--foreground);
  }
  .row { display:flex; align-items: baseline; gap: 16px; margin-bottom: 2px; }
  .row .tag { font-family: var(--font-body); font-size: 11px; color: var(--muted-foreground); width: 110px; flex-shrink: 0; letter-spacing: 0.06em; }
  .serif { font-family: var(--font-serif); font-weight: 400; line-height: 1.05; }
</style>
</head>
<body>
  <div class="row"><span class="tag">7XL · 80px</span><span class="serif" style="font-size:80px;">Memodi</span></div>
  <div class="row"><span class="tag">5XL · 52px</span><span class="serif" style="font-size:52px;">Memory Lane</span></div>
  <div class="row"><span class="tag">4XL · 40px</span><span class="serif" style="font-size:40px;">Add a memory</span></div>
  <div class="row"><span class="tag">3XL · 32px</span><span class="serif" style="font-size:32px; font-weight:500;">Weekly Summary</span></div>
  <div class="row"><span class="tag">2XL · 26px</span><span class="serif" style="font-size:26px; font-weight:500;">Summer Garden</span></div>
  <div class="row"><span class="tag">XL · 22px</span><span style="font-size:22px; font-weight:500;">Tap to speak with me</span></div>
  <div class="row"><span class="tag">LG · 18px</span><span style="font-size:18px;">Your cherished moments, preserved with love.</span></div>
  <div class="row"><span class="tag">BASE · 16px</span><span style="font-size:16px;">Manage and organize cherished memories.</span></div>
  <div class="row"><span class="tag">SM · 14px</span><span style="font-size:14px; color: var(--muted-foreground);">Yesterday, 8:30 PM · Coastal Beach</span></div>
</body>
</html>
