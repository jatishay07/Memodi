<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memodi — Corner Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 700px; height: 200px;
    background: var(--gradient-page);
    padding: 26px 28px;
    box-sizing: border-box;
    font-family: var(--font-body);
    color: var(--foreground);
  }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: end; height: 100%; }
  .box {
    background: #DC4F7C;
    box-shadow: 0 10px 28px rgba(220,79,124,0.26);
    height: 110px;
    display: flex; align-items: flex-end; padding: 12px;
    color: #fff;
  }
  .meta { font-size: 11px; line-height: 1.4; font-weight: 600; letter-spacing: 0.04em; }
  .meta .px { display:block; font-family: var(--font-serif); font-weight: 400; font-size: 18px; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="box" style="border-radius: 8px;"><div class="meta"><span class="px">8</span>XS · chip</div></div>
    </div>
    <div>
      <div class="box" style="border-radius: 14px;"><div class="meta"><span class="px">14</span>SM · input</div></div>
    </div>
    <div>
      <div class="box" style="border-radius: 20px;"><div class="meta"><span class="px">20</span>MD · field</div></div>
    </div>
    <div>
      <div class="box" style="border-radius: 24px;"><div class="meta"><span class="px">24</span>LG · card</div></div>
    </div>
    <div>
      <div class="box" style="border-radius: 32px;"><div class="meta"><span class="px">32</span>XL · modal</div></div>
    </div>
    <div>
      <div class="box" style="border-radius: 999px; aspect-ratio: 1; height: auto;"><div class="meta"><span class="px">∞</span>pill</div></div>
    </div>
  </div>
</body>
</html>
