<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memodi — Core Palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 700px; height: 220px;
    background: var(--gradient-page);
    padding: 28px 32px;
    box-sizing: border-box;
    font-family: var(--font-body);
    color: var(--foreground);
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; height: 100%; }
  .sw {
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 14px 16px;
    color: #fff;
    font-size: 12px;
    line-height: 1.3;
    position: relative;
    overflow: hidden;
  }
  .sw .name { font-family: var(--font-serif); font-size: 17px; font-weight: 500; }
  .sw .hex  { opacity: 0.85; font-weight: 600; letter-spacing: 0.04em; }
  .vc { color: #2d2d2d; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#DC4F7C">
      <div class="name">Blush Rose</div><div class="hex">#DC4F7C</div>
    </div>
    <div class="sw" style="background:#C42B34">
      <div class="name">Tomato Jam</div><div class="hex">#C42B34</div>
    </div>
    <div class="sw vc" style="background:#FCE9AB">
      <div class="name">Vanilla Custard</div><div class="hex">#FCE9AB</div>
    </div>
    <div class="sw" style="background:#FC8A2D">
      <div class="name">Princeton Orange</div><div class="hex">#FC8A2D</div>
    </div>
    <div class="sw" style="background:#9E9820">
      <div class="name">Olive</div><div class="hex">#9E9820</div>
    </div>
  </div>
</body>
</html>
