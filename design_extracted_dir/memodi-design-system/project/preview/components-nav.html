<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memodi — Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.487.0/dist/umd/lucide.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 700px; height: 280px;
    background: var(--gradient-page);
    padding: 24px;
    box-sizing: border-box;
    font-family: var(--font-body);
    color: var(--foreground);
    display: flex; flex-direction: column; gap: 18px;
  }
  .meta { font-size: 11px; color: var(--muted-foreground); letter-spacing: 0.1em; text-transform: uppercase; padding-left: 6px; }

  /* Patient pill nav */
  .patient-nav { display:flex; gap: 12px; }
  .pill {
    display:inline-flex; align-items:center; gap: 10px;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(255,255,255,0.4);
    border: 2px solid rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    color: var(--muted-foreground);
    font-weight: 500;
    font-size: 16px;
  }
  .pill.active {
    background: rgba(255,255,255,0.8);
    border-color: rgba(255,255,255,0.9);
    box-shadow: var(--shadow-md);
    color: var(--color-blush-rose);
  }

  /* Caregiver bar */
  .care-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px;
    border-radius: 28px;
    background: rgba(255,255,255,0.4);
    border: 2px solid rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
  }
  .brand {
    font-family: var(--font-serif); font-size: 28px; font-weight: 500;
    color: #4a3f33;
  }
  .links { display:flex; gap: 8px; align-items: center; }
  .care-tab {
    display:inline-flex; align-items:center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 15px;
    background: rgba(255,255,255,0.6); border: 2px solid rgba(255,255,255,0.8);
    color: var(--muted-foreground);
  }
  .care-tab.active { background: #FC8A2D; color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(252,138,45,0.28); }
  .care-tab .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-tomato-jam); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
  .signout { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.6); border: 2px solid rgba(255,255,255,0.8); color: var(--muted-foreground); font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <div>
    <div class="meta">Patient · floating pill nav</div>
    <div class="patient-nav" style="margin-top:8px;">
      <div class="pill active"><i data-lucide="home" style="width:18px;height:18px"></i>Dashboard</div>
      <div class="pill"><i data-lucide="images" style="width:18px;height:18px"></i>Memory Lane</div>
    </div>
  </div>
  <div>
    <div class="meta">Caregiver · fixed top bar</div>
    <div class="care-bar" style="margin-top:8px;">
      <div style="display:flex; align-items:center; gap: 24px;">
        <span class="brand">Memodi</span>
        <div class="links">
          <span class="care-tab active"><i data-lucide="database" style="width:16px;height:16px"></i>Memory Base</span>
          <span class="care-tab"><i data-lucide="bell" style="width:16px;height:16px"></i>Alerts<span class="dot"></span></span>
        </div>
      </div>
      <span class="signout">Sign out</span>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
