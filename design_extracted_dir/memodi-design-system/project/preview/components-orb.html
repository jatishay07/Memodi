<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memodi — AI Orb States</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 700px;
    height: 260px;
    box-sizing: border-box;
    background: linear-gradient(135deg, #FFF9F0 0%, #FFFBF7 40%, rgba(252,233,171,0.30) 100%);
    padding: 24px 28px;
    font-family: var(--font-body);
    color: var(--foreground);
  }
  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    height: 100%;
    align-items: end;
  }
  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    height: 100%;
  }
  .orb-wrap {
    position: relative;
    width: 116px;
    height: 116px;
  }
  .orb-container {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .label { text-align: center; line-height: 1.2; }
  .label b {
    display: block;
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 500;
    color: #4a3f33;
  }
  .label span {
    display: block;
    font-size: 10px;
    color: var(--muted-foreground);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
</style>

<script type="importmap">
  {
    "imports": {
      "ogl": "https://cdn.skypack.dev/ogl@1.0.11"
    }
  }
</script>
<script type="module">
  import * as OGL from 'ogl';
  window.OGL = OGL;
  window.dispatchEvent(new Event('ogl-loaded'));
</script>
</head>
<body>
  <div class="row" id="row">
    <div class="item">
      <div class="orb-wrap"><div class="orb-container" data-state="idle"></div></div>
      <div class="label"><b>Idle</b><span>soft sunset</span></div>
    </div>
    <div class="item">
      <div class="orb-wrap"><div class="orb-container" data-state="listening"></div></div>
      <div class="label"><b>Listening</b><span>warm orange</span></div>
    </div>
    <div class="item">
      <div class="orb-wrap"><div class="orb-container" data-state="thinking"></div></div>
      <div class="label"><b>Thinking</b><span>olive haze</span></div>
    </div>
    <div class="item">
      <div class="orb-wrap"><div class="orb-container" data-state="speaking"></div></div>
      <div class="label"><b>Speaking</b><span>blush glow</span></div>
    </div>
    <div class="item">
      <div class="orb-wrap"><div class="orb-container" data-state="distress"></div></div>
      <div class="label"><b>Distress</b><span>deep tomato</span></div>
    </div>
  </div>

  <script>
  /*
   * Memodi Orb states — uses the SAME reactbits Orb shader as the wordmark,
   * but the three base colors are passed in as uniforms so each state can
   * have its own palette while sharing the exact noise + light geometry.
   */
  function makeStateColors() {
    // [color1 brightest, color2 secondary, color3 deep core] — RGB 0..1
    const hex = (h) => {
      const r = parseInt(h.slice(1,3),16)/255;
      const g = parseInt(h.slice(3,5),16)/255;
      const b = parseInt(h.slice(5,7),16)/255;
      return [r,g,b];
    };
    return {
      idle:      [hex("#FC8A2D"), hex("#DC4F7C"), hex("#FCE9AB")], // sunset
      listening: [hex("#FC8A2D"), hex("#FCE9AB"), hex("#FC8A2D")], // warm orange
      thinking:  [hex("#9E9820"), hex("#FC8A2D"), hex("#FCE9AB")], // olive haze
      speaking:  [hex("#DC4F7C"), hex("#FC8A2D"), hex("#DC4F7C")], // blush
      distress:  [hex("#C42B34"), hex("#DC4F7C"), hex("#C42B34")], // tomato
    };
  }

  function mountOrb(container, baseColors, timeScale = 1) {
    const { Mesh, Program, Renderer, Triangle, Vec3 } = window.OGL;

    const vert = `
      precision highp float;
      attribute vec2 position;
      attribute vec2 uv;
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position, 0.0, 1.0); }
    `;
    const frag = `
      precision highp float;
      uniform float iTime;
      uniform vec3 iResolution;
      uniform vec3 baseColor1;
      uniform vec3 baseColor2;
      uniform vec3 baseColor3;
      uniform vec3 backgroundColor;
      varying vec2 vUv;

      vec3 hash33(vec3 p3) {
        p3 = fract(p3 * vec3(0.1031, 0.11369, 0.13787));
        p3 += dot(p3, p3.yxz + 19.19);
        return -1.0 + 2.0 * fract(vec3(p3.x+p3.y, p3.x+p3.z, p3.y+p3.z) * p3.zyx);
      }
      float snoise3(vec3 p) {
        const float K1 = 0.333333333;
        const float K2 = 0.166666667;
        vec3 i = floor(p + (p.x + p.y + p.z) * K1);
        vec3 d0 = p - (i - (i.x + i.y + i.z) * K2);
        vec3 e = step(vec3(0.0), d0 - d0.yzx);
        vec3 i1 = e * (1.0 - e.zxy);
        vec3 i2 = 1.0 - e.zxy * (1.0 - e);
        vec3 d1 = d0 - (i1 - K2);
        vec3 d2 = d0 - (i2 - K1);
        vec3 d3 = d0 - 0.5;
        vec4 h = max(0.6 - vec4(dot(d0,d0), dot(d1,d1), dot(d2,d2), dot(d3,d3)), 0.0);
        vec4 n = h * h * h * h * vec4(
          dot(d0, hash33(i)), dot(d1, hash33(i + i1)),
          dot(d2, hash33(i + i2)), dot(d3, hash33(i + 1.0))
        );
        return dot(vec4(31.316), n);
      }
      vec4 extractAlpha(vec3 c) {
        float a = max(max(c.r, c.g), c.b);
        return vec4(c.rgb / (a + 1e-5), a);
      }

      const float innerRadius = 0.6;
      const float noiseScale = 0.65;

      float light1(float i, float a, float d) { return i / (1.0 + d * a); }
      float light2(float i, float a, float d) { return i / (1.0 + d * d * a); }

      vec4 draw(vec2 uv) {
        vec3 color1 = baseColor1;
        vec3 color2 = baseColor2;
        vec3 color3 = baseColor3;

        float ang = atan(uv.y, uv.x);
        float len = length(uv);
        float invLen = len > 0.0 ? 1.0 / len : 0.0;
        float bgLuminance = dot(backgroundColor, vec3(0.299, 0.587, 0.114));

        float n0 = snoise3(vec3(uv * noiseScale, iTime * 0.5)) * 0.5 + 0.5;
        float r0 = mix(mix(innerRadius, 1.0, 0.4), mix(innerRadius, 1.0, 0.6), n0);
        float d0 = distance(uv, (r0 * invLen) * uv);
        float v0 = light1(1.0, 10.0, d0);
        v0 *= smoothstep(r0 * 1.05, r0, len);
        float innerFade = smoothstep(r0 * 0.8, r0 * 0.95, len);
        v0 *= mix(innerFade, 1.0, bgLuminance * 0.7);
        float cl = cos(ang + iTime * 2.0) * 0.5 + 0.5;

        float a = iTime * -1.0;
        vec2 pos = vec2(cos(a), sin(a)) * r0;
        float d = distance(uv, pos);
        float v1 = light2(1.5, 5.0, d);
        v1 *= light1(1.0, 50.0, d0);

        float v2 = smoothstep(1.0, mix(innerRadius, 1.0, n0 * 0.5), len);
        float v3 = smoothstep(innerRadius, mix(innerRadius, 1.0, 0.5), len);

        vec3 colBase = mix(color1, color2, cl);
        float fadeAmount = mix(1.0, 0.1, bgLuminance);

        vec3 darkCol = mix(color3, colBase, v0);
        darkCol = (darkCol + v1) * v2 * v3;
        darkCol = clamp(darkCol, 0.0, 1.0);

        vec3 lightCol = (colBase + v1) * mix(1.0, v2 * v3, fadeAmount);
        lightCol = mix(backgroundColor, lightCol, v0);
        lightCol = clamp(lightCol, 0.0, 1.0);

        vec3 finalCol = mix(darkCol, lightCol, bgLuminance);
        return extractAlpha(finalCol);
      }

      void main() {
        vec2 fragCoord = vUv * iResolution.xy;
        vec2 center = iResolution.xy * 0.5;
        float size = min(iResolution.x, iResolution.y);
        vec2 uv = (fragCoord - center) / size * 2.0;
        vec4 col = draw(uv);
        gl_FragColor = vec4(col.rgb * col.a, col.a);
      }
    `;

    const renderer = new Renderer({ alpha: true, premultipliedAlpha: false });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    container.appendChild(gl.canvas);

    const geom = new Triangle(gl);
    const program = new Program(gl, {
      vertex: vert,
      fragment: frag,
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new Vec3(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height) },
        baseColor1: { value: new Vec3(...baseColors[0]) },
        baseColor2: { value: new Vec3(...baseColors[1]) },
        baseColor3: { value: new Vec3(...baseColors[2]) },
        backgroundColor: { value: new Vec3(255/255, 251/255, 247/255) }, // #FFFBF7
      },
    });
    const mesh = new Mesh(gl, { geometry: geom, program });

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w * dpr, h * dpr);
      gl.canvas.style.width = w + "px";
      gl.canvas.style.height = h + "px";
      program.uniforms.iResolution.value.set(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    let raf;
    const update = (t) => {
      raf = requestAnimationFrame(update);
      program.uniforms.iTime.value = (t * 0.001) * timeScale;
      renderer.render({ scene: mesh });
    };
    raf = requestAnimationFrame(update);
  }

  function init() {
    const palette = makeStateColors();
    // Distress is the only state that breathes faster — everything else stays calm.
    const timeScales = { idle: 0.6, listening: 0.9, thinking: 0.7, speaking: 0.9, distress: 1.6 };
    document.querySelectorAll(".orb-container").forEach((el) => {
      const state = el.dataset.state;
      mountOrb(el, palette[state], timeScales[state] || 0.7);
    });
  }
  if (window.OGL) init();
  else window.addEventListener("ogl-loaded", init, { once: true });
  </script>
</body>
</html>
