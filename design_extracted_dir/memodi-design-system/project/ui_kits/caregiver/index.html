<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memodi — Caregiver UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--foreground);
    background: linear-gradient(135deg, #FFF9F0 0%, #FFFBF7 40%, rgba(252,233,171,0.10) 100%);
    background-attachment: fixed;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.487.0/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="CaregiverAmbient.jsx" data-presets="react"></script>
  <script type="text/babel" src="CaregiverNav.jsx" data-presets="react"></script>
  <script type="text/babel" src="MemoryBase.jsx" data-presets="react"></script>
  <script type="text/babel" src="Alerts.jsx" data-presets="react"></script>

  <script type="text/babel" data-presets="react">
    const CaregiverShell = () => {
      const [screen, setScreen] = React.useState("memory-base");

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const label = screen === "memory-base" ? "01 Memory Base" : "02 Alerts";

      return (
        <div data-screen-label={label}>
          <CaregiverNav
            current={screen}
            onNavigate={setScreen}
            onSignOut={() => alert("Signed out (demo)")}
          />
          {screen === "memory-base" && <MemoryBase />}
          {screen === "alerts" && <Alerts />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CaregiverShell />);
  </script>
</body>
</html>
