version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - cd web && npm ci
    build:
      commands:
        - cd web && npm run build
  artifacts:
    baseDirectory: web/.next
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - web/.next/cache/**/*
